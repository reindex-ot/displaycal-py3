  このオプションは、実際にデバッグ情報が必要な場合 (ArgyllCMS 機能のトラブルシューティングなど) のみ使用してください。通常、このオプションはソフトウェア開発者が問題の診断と解決を支援する場合にのみ役立ちます。デバッグ出力を有効にしてもよろしいですか?
