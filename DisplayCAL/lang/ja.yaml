"info.3dlut_settings": |-
  A <font weight='bold'>3D LUT</font> (LUT = ルックアップテーブル) またはICCデバイスリンクプロファイルは、3D LUTまたはICCデバイスリンク対応アプリケーションでフル機能で使用できます。 <font weight='bold'>display color correction</font>.
  
  <font weight='bold'>既存のプロファイルから複数の（追加の）3D LUT</font>
  を作成する 「設定」で目的のプロファイルを選択した状態で、「プロファイリング後に 3D LUT を作成する」チェックボックスをオフにします。
  
  <font weight='bold'>C適切なソース カラースペースとトーン レスポンス カーブの選択</font>
  3D LUT および ICC デバイス リンク プロファイルの場合、ソース カラースペースとトーン レスポンス カーブを事前に設定し、全体的なカラー変換の固定部分とする必要があります (動的にオンザフライでリンクされる ICC デバイス プロファイルとは異なります)。たとえば、HD ビデオ素材は通常、Rec. 709 標準に従ってマスタリングされ、純粋なパワー ガンマは約 2.2 ～ 2.4 (黒出力オフセットが 100% の相対値) または Rec. 1886 トーン レスポンス カーブ (黒出力オフセットが 0% の絶対値) のいずれかになります。黒出力オフセットを 0% ～ 100% の値に設定することで、Rec. 1886 のようなパワーと純粋なパワーを分割することもできます。
  
  <font weight='bold'>“「絶対」ガンマと「相対」ガンマ</font>
  実際のディスプレイの非ゼロの黒レベルに対応するには、トーン応答曲線をオフセットし、それに応じてスケーリングする必要があります。
  「絶対」ガンマでは、50% 入力での実際の出力は、理想的な電力曲線と一致しません (黒レベルがゼロでない限り)。
  「相対」ガンマは、50% 入力での実際の出力を生成し、これは理想的な電力曲線と一致します。
  
  <font weight='bold'>レンダリングの目的</font>
  ソース カラースペースで必須のホワイトポイントとは異なるホワイトポイントに調整し、代わりにそれを 3D LUT に使用する場合は、「相対カラーメトリック」を選択します。それ以外の場合は、「ホワイトポイント スケーリングによる絶対カラーメトリック」を選択します (ホワイトポイント スケーリングにより、ソース カラースペースのホワイトポイントがディスプレイ色域外にある場合に発生する可能性がある絶対カラーメトリック モードでのクリッピングを防止できます)。また、非カラーメトリック レンダリング インテントを使用するオプションもあります。このレンダリング インテントでは、ソース カラースペースを圧縮または拡張してディスプレイ色域内に収まるようにできます (カラーメトリックの精度が必要な場合は推奨されません)。
"info.calibration_settings": |-
  <font weight='bold'>	キャリブレーション</font>は、選択したホワイトポイントや輝度に合わせて<font weight='bold'>ディスプレイを対話的</font>に調整し、オプションで <font weight='bold'>1D LUT キャリブレーション カーブ</font> (LUT = ルックアップ テーブル) を作成して、選択したトーン応答カーブに合わせてグレー バランスを確保することで行われます。キャリブレーション中にディスプレイの調整のみを行い、1D LUT カーブの生成をスキップする場合は、トーン応答カーブを「測定値どおり」に設定する必要があります。1D LUT キャリブレーションは、完全なディスプレイの色補正には使用<font weight='bold'>できません</font>。<font weight='bold'>ICC デバイス プロファイル</font>または <font weight='bold'>3D LUT</font> を作成し、その目的でそれらをサポートするアプリケーションで使用する必要があります。ただし、1D LUT キャリブレーションは、プロファイリングと 3D LUT キャリブレーションを補完します。
"info.display_instrument": |-
  該当する場合は、<font weight='bold'>ディスプレイのダイナミック ピクチャ設定をすべて無効にします</font>。 これには、ダイナミックコントラスト、調光、自動明るさ調整などの機能が含まれます。
  
  ディスプレイの画面に光が直接当たらないようにしてください。
  
  ディスプレイが <font weight='bold'>OLED</font> や<font weight='bold'>プラズマ</font> TV、または画像コンテンツに応じて光出力が変化するその他のタイプの場合は、<font weight='bold'>白レベルドリフト補正</font>を有効にします。
  
  機器が<font weight='bold'>分光計</font>であり、黒レベルが安定したディスプレイ上で接触モードで使用する場合は、機器の<font weight='bold'>黒レベルドリフト補正</font>を有効にする必要がある場合があります。
  
  お使いの機器が<font weight='bold'>色彩測定器</font>である場合は、ディスプレイまたはディスプレイ技術の種類に適した<font weight='bold'>測定モード</font>または<font weight='bold'>補正</font>を使用する必要があります。一部の機器 (K-10、Spyder4/5/X など) では、特定のディスプレイの種類に合わせて調整済みの測定モードが選択できる場合があります。
"info.display_instrument.warmup": |-
  測定を開始する前に、ディスプレイを少なくとも <font weight='bold'>30 分間</font><font weight='bold'>ウォームアップ</font>させてください。機器を接触モードで使用する場合は、その間もディスプレイをオンにしたままにしておくことをお勧めします。
"info.display_tech": |-
  <font weight='bold'>LCD 白色 LED</font> (通常の色域と最大 100% の sRGB カバレッジを備えた WLED) は、最も一般的な LCD バックライト技術です。このカテゴリのディスプレイには、2010 年以降のほとんどのラップトップ、ノートブック、オールラウンド/オフィス、非 HDR ゲーム モニター、および 2009 年から 2015 年半ばまでの Apple iMac/MacBook が含まれます。
  
  <font weight='bold'>LCD PFS Phosphor WLED</font> は、2 つの一般的なバリエーションで広い色域を持ち、P3 または Adob​​e RGB のカバー率は約 90 ～ 99% です (メーカーのデータによる)。P3 色域カテゴリの一般的なディスプレイには、Apple iMac 4K/5K Retina (2015 年後半以降)、MacBook Pro Retina (2016 年後半以降)、および一部の HDR 対応デスクトップ モニターがあります。Adobe RGB 色域カテゴリには、EIZO CG2730、HP DreamColor Z24x G2、NEC PA271Q などのプロ仕様のディスプレイが含まれます。
  
  <font weight='bold'>LCD 量子ドット LED</font> は、ほぼ完全な P3 カバレッジを備えた広い色域を持ち、Samsung QLED TV でよく使用されます。
  
  <font weight='bold'>WOLED</font> は、広い色域と高い P3 カバレッジを備えており、LG OLED TV でよく使用されています。
  
  <font weight='bold'>RGB OLED/AMOLED</font> は、Adobe RGB および/または P3 をほぼ完全にカバーする広い色域を備えており、一部のプロフェッショナル モニターやラップトップ、高品質のスマートフォンに使用されています。
  
  <font weight='bold'>LCD GB-r-LED</font> (GB-LED とも呼ばれる) は、Adobe RGB カバー率が約 99% と広い色域を備えています (メーカーのデータによる)。このカテゴリの一般的なディスプレイには、Dell U2413、EIZO CG247/CG277、NEC PA242W/PA272W などがあります。
  
  <font weight='bold'>LCD RGB LED</font> は、Adobe RGB をほぼ完全にカバーする広い色域を備えています。このカテゴリの一般的なディスプレイには、Samsung XL20/XL24/XL30 や HP DreamColor LP2480zx などがあります。
  
  <font weight='bold'>LCD CCFL</font> と <font weight='bold'>LCD CCFL Wide Gamut</font> は、2009 年以前のディスプレイで一般的に使用されている古いバックライト技術です。
"info.display_tech.linklabel.displayspecifications.com": |-
  モニター/テレビとそれに対応するテクノロジーを displayspecifications.com で見つけてください。
