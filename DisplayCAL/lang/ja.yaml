"profile_loader.fix_profile_associations_warning": |-
  プロファイル ローダーが実行されている限り、ディスプレイ構成を変更するときにプロファイルの関連付けを処理できます。
  
  続行する前に、上記のプロファイルの関連付けが正しいことを確認してください。正しくない場合は、次の手順に従ってください :
  
  1. Windows のディスプレイ設定を開きます。
  2. 接続されているすべてのディスプレイ（拡張デスクトップ）をアクティブにします。
  3. プロファイルの関連付けを開きます。
  4. 各ディスプレイ デバイスに正しいプロファイルが割り当てられていることを確認します。次に、プロファイルの関連付けを閉じます。
  5. Windows のディスプレイ設定で、以前のディスプレイ構成に戻して、ディスプレイ設定を閉じます。
  6. これで、「プロファイルの関連付けを自動的に修正する」を有効にすることができます。
