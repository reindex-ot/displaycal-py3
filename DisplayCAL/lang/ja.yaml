"donation_header": |-
  応援よろしくお願いします!
"donation_message": |-
  DisplayCAL と ArgyllCMS の開発、技術支援、および継続的な利用可能性をサポートしたい場合は、資金援助をご検討ください。DisplayCAL は ArgyllCMS なしでは役に立たないため、DisplayCAL に寄せられたすべての寄付は両方のプロジェクトに分割されます。
  軽い個人的な非商用使用の場合、1 回限りの寄付が適切かもしれません。DisplayCAL を専門的に使用している場合は、年間または毎月の寄付を行うことで、両方のプロジェクトが引き続き利用可能になることが保証され、大きな違いが生まれます。
  
  貢献者の皆様に感謝します!
