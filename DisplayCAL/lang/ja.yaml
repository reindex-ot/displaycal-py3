"info.mr_settings": |-
  測定されたパッチの色誤差に関する詳細な統計情報を含む測定レポートを使用して、ICC プロファイルまたは 3D LUT の<font weight='bold'>精度を検証</font>できます。
  
  3D LUT を検証するときは、3D LUT が作成されたのと同じ設定を使用するようにしてください。
  
  <font weight='bold'>ヒント :</font> 測定レポートの代わりにセルフチェック レポートを作成するには、キーボードの ALT キーを押し続けます。
"info.profile_settings": |-
  <font weight='bold'>プロファイリング</font>とは、ディスプレイの<font weight='bold'>特性</font>を評価し、その応答を ICC デバイス プロファイルに記録するプロセスです。<font weight='bold'>ICC デバイス プロファイル</font>は、ICC カラー管理をサポートするアプリケーションで完全な<font weight='bold'>ディスプレイ カラー補正</font>に使用したり、3D LUT (LUT = ルック アップ テーブル) を作成するために使用したりして、<font weight='bold'>3D LUT</font> をサポートするアプリケーションで同じ目的を果たすことができます。
  
  測定されるパッチの数は、結果のプロファイルの達成可能な精度に影響します。ディスプレイの加法混色特性と直線性が良好であれば、妥当な品質の 3x3 マトリックスおよび曲線ベースのプロファイルの場合、数十個のパッチで十分な場合があります。一部のプロ用ディスプレイは、このカテゴリに該当します。可能な限り最高の精度が必要な場合は、数百から数千個のパッチからなる LUT ベースのプロファイルをお勧めします。<font weight='bold'>「自動最適化」</font> テストチャート設定では、ディスプレイの非直線性と実際の応答が自動的に考慮されるため、最高品質の結果を得るために使用する必要があります。これにより、スライダーを調整して、結果のプロファイル精度と測定および計算時間の間の妥協点を選択できます。
