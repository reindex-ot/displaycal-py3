"display.levels_issue_detected": |-
  RGB レベル 0 と 16 の間で測定された輝度差は 0.02 cd/m² 未満であり、クリッピングを示しています。ディスプレイ デバイスの入力レベル設定や黒レベル設定が正しくないか、グラフィック ドライバーの出力レベル構成が間違っている可能性があります。
  
  ディスプレイ デバイスに入力レベルの設定がある場合は、フル レンジ RGB (0 ～ 255) に設定してください。ディスプレイ デバイスにそのような設定がない場合は、代わりにグラフィック ドライバーを制限された範囲 (16 ～ 235) の出力に設定してください。いずれかの変更を行った後、「再試行」を選択してください。
  
  ディスプレイにもグラフィック ドライバーにも範囲設定がない場合は、「続行」をクリックしてビデオ カードのガンマ テーブルを使用して出力レベルを修正することもできますが、これはあまり好ましくない解決策であることに注意してください。
