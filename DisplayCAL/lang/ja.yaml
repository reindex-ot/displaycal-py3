"drift_compensation.blacklevel": |-
  黒レベルドリフト補正
"drift_compensation.blacklevel.info": |-
  黒レベル ドリフト補正は、測定デバイスのウォーミング アップ時の黒キャリブレーション ドリフトによって生じる測定偏差に対抗するものです。この目的のため、黒テスト パッチが定期的に測定されますが、これにより測定に必要な全体的な時間が長くなります。多くの色彩計には温度補正が組み込まれているため、黒レベル ドリフト補正は必要ありませんが、ほとんどの分光計は温度補正されていません。
"drift_compensation.whitelevel": |-
  ホワイトレベルドリフト補正
"drift_compensation.whitelevel.info": |-
  ホワイト レベル ドリフト補正は、ディスプレイ デバイスのウォーミング アップ時の輝度変化によって生じる測定偏差に対抗するものです。この目的のため、ホワイト テスト パッチが定期的に測定されますが、これにより測定に必要な全体的な時間が長くなります。
