"argyll.instrument.driver.missing": |-
  測定デバイス用の ArgyllCMS ドライバーがインストールされていないか、正しくインストールされていないようです。測定デバイスが Windows のデバイス マネージャーの「Argyll LibUSB-1.0A デバイス」に表示されているかどうかを確認し、必要に応じてドライバーを (再) インストールしてください。インストール手順については、ドキュメントをお読みください。
"argyll.instrument.drivers.install": |-
  ArgyllCMS 機器ドライバーをインストール...
"argyll.instrument.drivers.install.confirm": |-
  ColorMunki Display、i1 Display Pro、Huey、ColorHug、specbos、spectraval、K-10 以外の測定機器をお持ちの場合は、ArgyllCMS 固有のドライバーのみをインストールする必要があります。
  
  続行しますか?
"argyll.instrument.drivers.install.failure": |-
  ArgyllCMS 機器ドライバーのインストールに失敗しました。
"argyll.instrument.drivers.install.restart": |-
  ArgyllCMS 計測器ドライバをインストールするには、ドライバ署名の強制を無効にする必要があります。そのためには、システムを再起動する必要があります。表示されるページで「トラブルシューティング」を選択し、次に「詳細オプション」、「スタートアップ設定」、最後に「再起動」を選択します。起動時に、「ドライバ署名の強制を無効にする」を選択します。再起動後、メニューでもう一度「ArgyllCMS 計測器ドライバをインストール...」を選択して、ドライバをインストールします。「トラブルシューティング」オプションが表示されない場合は、DisplayCAL ドキュメントのセクション「Windows での計測器ドライバのインストール」で、ドライバ署名の強制を無効にする別の方法を参照してください。
"argyll.instrument.drivers.uninstall": |-
  ArgyllCMS 機器ドライバーをアンインストール...
"argyll.instrument.drivers.uninstall.confirm": |-
  注: アンインストールは現在使用中の計測器ドライバーには影響しませんが、Windows のドライバー ストアからドライバーが削除されるだけです。お使いの計測器にインストールされているベンダー提供のドライバーに戻す場合は、Windows のデバイス マネージャーを使用して手動でベンダー ドライバーに切り替える必要があります。これを行うには、計測器を右クリックして [ドライバー ソフトウェアの更新...] を選択し、[コンピューターを参照してドライバー ソフトウェアを検索]、[コンピューター上のデバイス ドライバーの一覧から選択する] の順に選択し、最後に一覧から計測器のベンダー ドライバーを選択します。
  
  続行しますか?
"argyll.instrument.drivers.uninstall.failure": |-
