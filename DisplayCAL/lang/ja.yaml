  警告 : ディスプレイ プロファイルのブラック ポイント以下の値はクリップされます。
"warning.suspicious_delta_e": |-
  警告: 疑わしい測定値が見つかりました。このチェックは sRGB のようなディスプレイ デバイスを想定していることに注意してください。ディスプレイ デバイスがこの想定と異なる場合 (たとえば、色域が非常に広い場合やトーン応答が sRGB からかけ離れている場合)、検出されたエラーはおそらく意味がありません。
  
  次の条件の 1 つまたはすべてが一致しました :
  
  • RGB 番号が異なる連続したパッチですが、互いの測定値の ΔE*00 が疑わしいほど低くなっています。
  • 前のパッチに向かって RGB の数値が増加しますが、明度 (L*) は減少する RGB グレー。
  • 前のパッチに向かって RGB 数値が減少しますが、明度 (L*) は上昇する RGB グレー。
  • RGB 数値の sRGB 相当値に対する測定値の ΔE*00 および ΔL*00 または ΔH*00 または ΔC*00 が異常に高い。
  
  これは測定エラーを示唆している可能性があります。問題があると考えられる値 (必ずしもそうである必要はありません) は赤で強調表示されます。測定値を注意深く確認し、受け入れたいものにマークを付けます。RGB 値と XYZ 値を編集することもできます。
"warning.suspicious_delta_e.info": |-
  Δ 列の説明 :
  
  ΔE*00 XYZ A/B: 前回のパッチの測定値に対する測定値の ΔE*00。この値がない場合、チェック時の要素ではありませんでした。存在する場合は、低すぎると想定されます。
  
  0.5 ΔE*00 RGB A/B: 前のパッチの RGB 数値の sRGB 相当に対する RGB 数値の sRGB 相当の ΔE*00 (係数 0.5)。この値が存在する場合、ΔE*00 XYZ A/B が低すぎると想定されるかどうかをチェックする際の比較 (最小) 値を表します。これは非常に大まかな方向付けとして機能します。
  
  ΔE*00 RGB-XYZ: RGB 数値の sRGB 相当に対する測定値の ΔE*00。
  ΔL*00 RGB-XYZ: RGB 数値の sRGB 相当に対する測定値の ΔL*00。
  ΔC*00 RGB-XYZ: RGB 数値の sRGB 相当に対する測定値の ΔC*00。
  ΔH*00 RGB-XYZ: RGB 数値の sRGB 相当に対する測定値の ΔH*00。
